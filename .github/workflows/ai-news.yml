name: Daily AI news

on:
  schedule:
    # Every day at 11:00 UTC (6am EST). GitHub cron is always UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Fetch AI headlines from NewsAPI
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-ai-news.mjs

      - name: Check the site still builds
        run: |
          npm ci
          npm run build

      # Only the news data file is committed. Vercel redeploys on the push.
      - name: Commit updated headlines
        run: |
          if git diff --quiet -- src/data/aiNews.json; then
            echo "No new headlines." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/aiNews.json
          git commit -m "update AI news headlines ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          jq -r '"Committed \(.articles | length) headlines from \(.from) to \(.to)."' src/data/aiNews.json >> "$GITHUB_STEP_SUMMARY"
