name: Daily AI news and community events

on:
  schedule:
    # Every day at 11:00 UTC (6am EST). GitHub cron is always UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Each fetch keeps its existing file if it fails, so one outage doesn't block the other.
      - name: Fetch AI headlines from NewsAPI
        continue-on-error: true
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-ai-news.mjs

      - name: Fetch community events (Luma calendars)
        continue-on-error: true
        run: node scripts/fetch-community-events.mjs

      - name: Check the site still builds
        run: |
          npm ci
          npm run build

      # Only the two data files are committed. Vercel redeploys on the push.
      - name: Commit updated data
        run: |
          FILES="src/data/aiNews.json src/data/communityEvents.json"
          if git diff --quiet -- $FILES; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "update AI news and community events ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          jq -r '"Headlines: \(.articles | length) (\(.from) to \(.to))"' src/data/aiNews.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Events: " + ([.calendars | to_entries[] | "\(.key) \(.value.events | length)"] | join(", "))' src/data/communityEvents.json >> "$GITHUB_STEP_SUMMARY"
