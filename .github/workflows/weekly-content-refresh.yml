name: Weekly content refresh

on:
  schedule:
    # Thursdays 17:00 UTC = 12pm EST (1pm during EDT). GitHub cron is always UTC
    # and runs can start a few minutes late under load.
    - cron: "0 17 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run refresh-content skill
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow token instead of the Claude GitHub App OIDC exchange.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Run the weekly content refresh by following the `refresh-content` skill in
            .claude/skills/refresh-content/SKILL.md exactly. You are running unattended in
            GitHub Actions on a checkout of `main`. Create the `content-refresh-YYYY-MM-DD`
            branch, push it, and open the PR with `gh pr create --base main`. Never push to
            or merge into `main`. If nothing but `dataAsOf` would change, stop without
            committing or opening a PR.
          claude_args: |
            --max-turns 80
            --allowedTools Read,Edit,Write,Glob,Grep,WebFetch,Skill,Bash(date:*),Bash(npm run build),Bash(npx eslint:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr list:*)

      # Claude's output is hidden in the public log, so summarise the outcome and any
      # blocked tool calls on the run page and keep the full transcript as an artifact.
      - name: Summarise Claude's run
        if: always()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -f "$f" ]; then echo "No Claude transcript found." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo "## Claude result"
            jq -r '[.[] | select(.type=="result")] | last | .result // "(no result text)"' "$f"
            echo
            echo "## Permission denials"
            echo '```json'
            jq '[.[] | select(.type=="result")] | last | .permission_denials // []' "$f"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Claude transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-transcript
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 14
          if-no-files-found: warn
